name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    outputs:
      version:
        description: The project version (LoadoutBuffs.csproj)
        value: ${{ jobs.build.outputs.version }}

permissions:
  contents: read

jobs:
  build:
    name: Build, test, package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      MANAGED_DIR: ${{ github.workspace }}/.valheim-managed
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          # 8: the tests; 10: the ILRepack tool
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Download the game DLLs (dedicated server, anonymous)
        run: .github/scripts/valheim-managed.sh "$MANAGED_DIR"

      - name: Version
        id: version
        run: echo "version=$(dotnet msbuild LoadoutBuffs.csproj -getProperty:Version)" >> "$GITHUB_OUTPUT"

      - name: Test
        run: make test DOTNET=dotnet MANAGED_DIR="$MANAGED_DIR"

      - name: Package
        run: make package DOTNET=dotnet MANAGED_DIR="$MANAGED_DIR"

      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: Algo7-LoadoutBuffs-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
