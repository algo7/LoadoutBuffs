<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- LoadoutBuffs icon: the mod's rune (a diamond on a stem, broken at its side corners like a Norse rune) in glowing cyan (#60ceec), on the
       round wooden shield of the author's other Valheim mod icons. Rendered to icon.png with cairosvg (1024 px, then
       LANCZOS down to 256); the in-game buff icon (src/Bundles/BuffIcon.png) is the same drawing without the dark
       square (the <rect> below). -->
  <defs>
    <clipPath id="wood"><circle cx="128" cy="128" r="96"/></clipPath>
    <radialGradient id="shade" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.35"/>
    </radialGradient>
  </defs>
  <rect width="256" height="256" rx="44" fill="#1c2128"/>
  <circle cx="128" cy="128" r="108" fill="#808c98"/>
  <circle cx="128" cy="128" r="96" fill="#704c2e"/>
  <g clip-path="url(#wood)" stroke="#593c26" stroke-width="3">
    <path d="M 48 20 V 236 M 72 20 V 236 M 96 20 V 236 M 120 20 V 236 M 144 20 V 236 M 168 20 V 236 M 192 20 V 236 M 216 20 V 236"/>
  </g>
  <circle cx="128" cy="128" r="96" fill="url(#shade)"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g id="rune"><path d="M 80 104 L 128 56 L 176 104"/><path d="M 80 116 L 128 157 L 176 116"/><path d="M 128 56 V 202"/></g>
    <use href="#rune" stroke="#60ceec" stroke-width="26" stroke-opacity="0.12"/>
    <use href="#rune" stroke="#60ceec" stroke-width="18" stroke-opacity="0.22"/>
    <use href="#rune" stroke="#60ceec" stroke-width="9"/>
  </g>
</svg>
